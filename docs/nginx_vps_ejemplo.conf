# Nginx delante del Sistema Cafeto en un VPS (referencia).
#
# Lo usa el servicio "nginx" de docker-compose.prod.yml (perfil "vps"):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile vps up -d --build
#
# Antes de usarlo: cambiar cafeto.tu-dominio.com por el dominio real y sacar
# el certificado (Let's Encrypt, por ejemplo con certbot en el VPS) en
# /etc/letsencrypt/live/<dominio>/.
#
# En el .env del VPS (ver .env.example):
#   DJANGO_ALLOWED_HOSTS=cafeto.tu-dominio.com,web
#   DJANGO_CSRF_TRUSTED_ORIGINS=https://cafeto.tu-dominio.com
#   CAFETO_URL_PUBLICA=https://cafeto.tu-dominio.com
#   DJANGO_CONFIAR_EN_PROXY=True   DJANGO_HTTPS=True   CAFETO_PROXIES_DE_CONFIANZA=1

upstream cafeto_web {
    server web:8000;
    keepalive 16;
}

# Los archivos estáticos que ya pasaron por Nginx se guardan en el disco del
# VPS: gunicorn no los vuelve a servir.
proxy_cache_path /var/cache/nginx/cafeto levels=1:2 keys_zone=cafeto_estaticos:10m
                 max_size=200m inactive=30d use_temp_path=off;

# HTTP: sólo para renovar el certificado y para mandar todo a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cafeto.tu-dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cafeto.tu-dominio.com;

    ssl_certificate     /etc/letsencrypt/live/cafeto.tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafeto.tu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cafeto_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # Las fotos de los productos y las facturas escaneadas (12 MB en Django).
    client_max_body_size 12m;

    # Compresión de las respuestas de Django (HTML, JSON de la API): con
    # datos móviles 4G es lo que más se nota. Los estáticos ya vienen
    # comprimidos por WhiteNoise (.br / .gz).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Lo que Django necesita saber del cliente real. X-Forwarded-For se
    # agrega al final (Django lo lee desde la derecha); CF-Connecting-IP se
    # borra: con Nginx al frente, ese encabezado lo podría escribir cualquiera.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;          # gunicorn corta a los 60

    # Estáticos con hash en el nombre (cafeto.3f2a1b9c0d4e.css): no cambian
    # nunca, el celular los guarda un año. Los demás, como los manda WhiteNoise.
    location ~* "^/static/.+\.[0-9a-f]{12}\.[a-z0-9]+$" {
        proxy_pass http://cafeto_web;
        proxy_cache cafeto_estaticos;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache $upstream_cache_status always;
    }
    location /static/ {
        proxy_pass http://cafeto_web;
        proxy_cache cafeto_estaticos;
        proxy_cache_valid 200 10m;
        proxy_ignore_headers Set-Cookie;
    }

    location / {
        proxy_pass http://cafeto_web;
    }

    # Si Django no contesta (reinicio, actualización): las páginas autónomas
    # de templates/, sin archivos externos.
    error_page 502 /errores/502.html;
    error_page 503 504 /errores/503.html;
    location ^~ /errores/ {
        internal;
        root /usr/share/nginx/html;
    }
}
