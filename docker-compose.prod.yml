# docker-compose.prod.yml — el sistema en producción: un VPS con Nginx y HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Con el Nginx de docs/nginx_vps_ejemplo.conf en un contenedor:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile vps up -d --build
#
# Lo que cambia respecto de desarrollo:
#   * la base NO publica su puerto: sólo la ve el contenedor web;
#   * Adminer no se levanta (es una puerta de entrada a la base);
#   * el código NO se monta: corre lo que quedó en la imagen;
#   * gunicorn en lugar del servidor de desarrollo (DJANGO_DEBUG=False);
#   * un servicio de respaldo de la base cada hora (RPO < 1 h), a ./respaldos;
#   * un servicio que pasa a histórico lo viejo el día 1 de cada mes (RPH).
#
# Desde internet se entra SIEMPRE por Nginx con HTTPS: el puerto 8000 queda
# atado a 127.0.0.1 (si Nginx corre en el VPS) y en la red interna de Docker
# (si corre en el contenedor "nginx"); nunca expuesto directo.
services:
  db:
    ports: !reset []

  adminer:
    profiles: ["herramientas"]

  web:
    # El código no se monta: corre el de la imagen. Sólo se monta, de sólo
    # lectura, la carpeta con la cuenta de servicio de Firebase de la app
    # móvil (./secretos/firebase.json, ver el README).
    volumes: !override
      - ./secretos:/run/secrets:ro
      # Las fotos de los productos: en un volumen, para que sobrevivan a una
      # imagen nueva (el código acá no está montado).
      - media_data:/opt/app/media
    restart: unless-stopped
    ports: !override
      - "${CAFETO_PUERTO_WEB:-127.0.0.1:8000}:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # Los estáticos que juntó la imagen, con hash en el nombre: el celular
      # los guarda un año y, cuando cambian, el nombre cambia solo.
      CAFETO_ESTATICOS_CON_HASH: "True"
      # Detrás de Nginx: la IP real del cliente y el https salen de sus
      # encabezados. Sin esto, todo el local quedaría con la IP del proxy
      # (y un bloqueo por intentos los frenaría a todos juntos).
      DJANGO_CONFIAR_EN_PROXY: ${DJANGO_CONFIAR_EN_PROXY:-True}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-True}
      DJANGO_REDIRIGIR_A_HTTPS: ${DJANGO_REDIRIGIR_A_HTTPS:-True}
      DJANGO_HSTS_SEGUNDOS: ${DJANGO_HSTS_SEGUNDOS:-3600}
      CAFETO_PROXIES_DE_CONFIANZA: ${CAFETO_PROXIES_DE_CONFIANZA:-1}
      CAFETO_ENCABEZADO_IP: ${CAFETO_ENCABEZADO_IP:-}
      # Vacío = sin /admin/ de Django.
      CAFETO_ADMIN_URL: ${CAFETO_ADMIN_URL:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}

  respaldo:
    image: postgres:16
    container_name: cafeto_respaldo
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      CAFETO_RESPALDOS_DIAS: ${CAFETO_RESPALDOS_DIAS:-14}
      CAFETO_RESPALDO_CADA_MINUTOS: ${CAFETO_RESPALDO_CADA_MINUTOS:-60}
    volumes:
      - ./respaldos:/respaldos
      - ./docker/respaldar.sh:/respaldar.sh:ro
    entrypoint: ["sh", "/respaldar.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Pase a histórico (RPH, DD-68): el día 1 de cada mes, de madrugada. Usa
  # la misma imagen que la aplicación porque el pase es un comando de Django
  # (pasar_a_historico): familias, cortes y verificación, en una sola
  # transacción.
  historico:
    image: proyecto-cafeto-web
    container_name: cafeto_historico
    restart: unless-stopped
    working_dir: /opt/app
    environment:
      TZ: America/Argentina/Salta
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    entrypoint: ["sh", "docker/pasar_a_historico.sh"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # Nginx delante del sistema (docs/nginx_vps_ejemplo.conf): HTTPS,
  # compresión, caché de estáticos y las páginas 502/503 autónomas.
  nginx:
    image: nginx:1.28-alpine
    container_name: cafeto_nginx
    profiles: ["vps"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CAFETO_NGINX_CONF:-./docs/nginx_vps_ejemplo.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./templates/502.html:/usr/share/nginx/html/errores/502.html:ro
      - ./templates/503.html:/usr/share/nginx/html/errores/503.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - web

volumes:
  media_data:
  nginx_cache:
