# docker-compose.yml — DESARROLLO.
# Orquesta tres contenedores: PostgreSQL, Adminer y la aplicacion Django.
# Para el NAS del local se suma docker-compose.prod.yml (ver ese archivo).
#
# El contenedor "web" se construye con el Dockerfile de esta carpeta: las
# dependencias quedan instaladas en la imagen y las migraciones se aplican
# solas al arrancar. Ya no hay instalacion manual dentro del contenedor.
#
#   docker compose up -d --build
#
# "name" fija el nombre del proyecto para que el volumen de datos siga
# siendo "proyecto-cafeto_db_data" y la base existente no se pierda.
name: proyecto-cafeto

services:

  # ---------- Servicio 1: Base de datos PostgreSQL ----------
  db:
    image: postgres:16
    container_name: cafeto_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Memoria acotada para una máquina de desarrollo de 4 GB: PostgreSQL
    # reserva shared_buffers de entrada (por defecto 128 MB) y hasta
    # work_mem por cada orden y cada hash de CADA consulta. Con estos
    # valores alcanza de sobra para la base de un comercio y quedan unos
    # 100 MB libres para los otros tres contenedores. En el NAS no se toca:
    # docker-compose.prod.yml tiene su propia configuración.
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=30
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------- Servicio 2: Adminer (administrador web de la BD) ----------
  # No arranca con "docker compose up": es una herramienta para mirar la
  # base a mano, no hace falta para trabajar, y un contenedor menos son
  # ~60 MB de RAM libres en una máquina de 4 GB. Cuando se la necesita:
  #
  #   docker compose --profile herramientas up -d adminer
  #
  # y queda en http://localhost:9090.
  adminer:
    image: adminer:latest
    container_name: cafeto_adminer
    profiles: ["herramientas"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "9090:8080"
    depends_on:
      - db

  # ---------- Servicio 3: Aplicacion Django ----------
  web:
    build: .
    container_name: cafeto_web
    restart: always
    working_dir: /opt/app
    volumes:
      # El codigo se monta para poder editarlo sin reconstruir la imagen.
      #
      # El esquema entero lo crean las migraciones de Django a partir de los
      # modelos, asi que un clon de este repositorio levanta solo, sin
      # carpetas externas.
      - .:/opt/app
      # La cuenta de servicio de Firebase para la app movil (README, «La app
      # movil»): ./secretos/firebase.json, fuera del repositorio. Se monta la
      # carpeta y no el archivo: si el archivo no existiera, Docker crearia
      # en su lugar una carpeta llamada firebase.json. Sin el archivo, la API
      # responde 503 en /clientes/ y el resto anda igual.
      - ./secretos:/run/secrets:ro
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      # Si el .env todavia no define estas claves, valen los de desarrollo.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-solo-para-desarrollo}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      # Un solo proceso de Python (sin el vigilante del autoreload): ver
      # docker/arrancar.sh. Con 8 GB o más, DJANGO_NORELOAD=False en .env.
      DJANGO_NORELOAD: ${DJANGO_NORELOAD:-True}
      # Desde qué direcciones se aceptan formularios y si hay un proxy o un
      # túnel adelante. Se usan igual en desarrollo cuando se entra por
      # Cloudflare Tunnel: sin reenviarlas, el login desde el túnel fallaba
      # con «CSRF verification failed» y la IP del cliente salía la del proxy.
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_CONFIAR_EN_PROXY: ${DJANGO_CONFIAR_EN_PROXY:-True}
      # En desarrollo los estáticos se sirven desde el código montado.
      CAFETO_ESTATICOS_CON_HASH: "False"
      # Correo para los enlaces de clave. Vacío en desarrollo: los correos
      # quedan como archivos en .correos/ (ver .env.example).
      DJANGO_CORREO_SERVIDOR: ${DJANGO_CORREO_SERVIDOR:-}
      DJANGO_CORREO_PUERTO: ${DJANGO_CORREO_PUERTO:-587}
      DJANGO_CORREO_USUARIO: ${DJANGO_CORREO_USUARIO:-}
      DJANGO_CORREO_CLAVE: ${DJANGO_CORREO_CLAVE:-}
      DJANGO_CORREO_REMITENTE: ${DJANGO_CORREO_REMITENTE:-Sistema Cafeto <no-responder@cafeto.local>}
      # App móvil: dónde está, DENTRO del contenedor, la cuenta de servicio
      # de Firebase (el montaje de ./secretos de arriba).
      CAFETO_FIREBASE_CREDENCIAL: ${CAFETO_FIREBASE_CREDENCIAL:-/run/secrets/firebase.json}
      # Correo con los nombres nuevos (Resend u otro SMTP). Si se definen,
      # mandan sobre los DJANGO_CORREO_* de arriba (ver .env.example).
      CAFETO_SMTP_HOST: ${CAFETO_SMTP_HOST:-}
      CAFETO_SMTP_PORT: ${CAFETO_SMTP_PORT:-}
      CAFETO_SMTP_USER: ${CAFETO_SMTP_USER:-}
      CAFETO_SMTP_PASSWORD: ${CAFETO_SMTP_PASSWORD:-}
      CAFETO_DEFAULT_FROM_EMAIL: ${CAFETO_DEFAULT_FROM_EMAIL:-}
      # Con qué dirección se llega al sistema desde afuera (fotos en la app).
      CAFETO_URL_PUBLICA: ${CAFETO_URL_PUBLICA:-}
      # Credencial de la API de servicio. Vacía = la API no existe.
      CAFETO_N8N_TOKEN: ${CAFETO_N8N_TOKEN:-}
      # Webhook de n8n para los pedidos de autorización a distancia (DD-94).
      CAFETO_N8N_WEBHOOK_AUTORIZACION: ${CAFETO_N8N_WEBHOOK_AUTORIZACION:-}
      # Webhook de n8n que lee la foto o el PDF de una factura (DD-98). Vacío =
      # la lee el propio sistema (PDF y texto; fotos si hay OCR instalado).
      CAFETO_N8N_WEBHOOK_FACTURA: ${CAFETO_N8N_WEBHOOK_FACTURA:-}
      # Desde qué orígenes el frontend en React puede usar /api/movil/.
      # Vacío en desarrollo = el de Vite (http://localhost:5173).
      CAFETO_CORS_ORIGINS: ${CAFETO_CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy

  # ---------- Automatizaciones (OPCIONALES) ----------
  # No arrancan con "docker compose up": sólo si se pide el perfil, porque
  # entre los dos piden alrededor de 1 GB de memoria.
  #
  #   docker compose --profile automatizacion up -d
  #
  # n8n habla con el sistema por la red interna (http://web:8000) usando la
  # API de servicio y CAFETO_N8N_TOKEN; no usa la sesión de ningún usuario.
  # Los dos puertos quedan atados a 127.0.0.1: se abren desde esta máquina,
  # no desde la red del local ni desde internet.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: cafeto_n8n
    profiles: ["automatizacion"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Argentina/Salta
      TZ: America/Argentina/Salta
      # Node reserva el montón (heap) según la RAM que ve de la máquina, no
      # la que queda libre: en un equipo de 4 GB n8n pedía ~1 GB sólo para
      # sí y dejaba al resto sin aire. 384 MB alcanzan para estos flujos.
      NODE_OPTIONS: --max-old-space-size=384
      # Para que los flujos lean la credencial sin tenerla escrita adentro.
      CAFETO_URL: http://web:8000
      CAFETO_N8N_TOKEN: ${CAFETO_N8N_TOKEN:-}
      # Los flujos de docs/n8n_workflows_cafeto.json leen estas variables.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      CAFETO_WHATSAPP_DUENIA: ${CAFETO_WHATSAPP_DUENIA:-}
      # El WhatsApp al que los proveedores mandan las facturas (DD-98).
      CAFETO_WHATSAPP_COMPRAS: ${CAFETO_WHATSAPP_COMPRAS:-}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - web

  # WhatsApp por una sesión de WhatsApp Web (WAHA). No es la API oficial de
  # WhatsApp: leer la advertencia en "Automatizaciones con n8n.md" (03 - Documentos).
  waha:
    image: devlikeapro/waha
    container_name: cafeto_waha
    profiles: ["automatizacion"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # Panel (localhost:3000/dashboard) y documentación de la API
      # (localhost:3000): si no se fijan, WAHA inventa una clave nueva en
      # cada arranque y hay que ir a buscarla al log. Por defecto, usuario
      # "admin" y la misma WAHA_API_KEY como clave.
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-${WAHA_API_KEY:-}}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-${WAHA_API_KEY:-}}
      TZ: America/Argentina/Salta
      # Facturas por WhatsApp (DD-98): WAHA le avisa a n8n cada mensaje que
      # llega. Vacío = no avisa (el flujo 7 no recibe nada).
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-}
      WHATSAPP_HOOK_EVENTS: message
    volumes:
      - waha_data:/app/.sessions

# Volumen nombrado: conserva los datos aunque se borre el contenedor
volumes:
  db_data:
  n8n_data:
  waha_data:
